# Unhashed files (pages, robots.txt, sitemap.xml) are revalidated on every visit (no-cache: a 304 when unchanged),
# so a browser never keeps a page whose assets a deploy replaced; the hashed /assets/ never change. Cloudflare's edge
# keeps both until the next deploy purges the unhashed ones (cloudflare-purge.sh).
map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  add_header Cache-Control $cache_control;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # The Content-Security-Policy, written at build time with the hashes of the prerendered inline scripts
  # (scripts/csp.mjs).
  include /etc/nginx/csp.conf;

  # Every page is prerendered: /pt/ will be pt/index.html. Anything else is a real 404.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
}
