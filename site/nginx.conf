server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # The Content-Security-Policy, written at build time with the hashes of the prerendered inline scripts
  # (scripts/csp.mjs).
  include /etc/nginx/csp.conf;

  # A location with its own add_header drops the server-level ones, so they are repeated here.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/csp.conf;
    try_files $uri =404;
  }

  # Every page is prerendered: /pt/ will be pt/index.html. Anything else is a real 404.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
}
