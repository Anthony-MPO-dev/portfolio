# The local copy's front door (local/compose.yaml): /api to the API, everything else to the site, as Easypanel routes
# anthonymuniz.dev. Answers stream through unbuffered, as the chat needs.
server {
  listen 80;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_buffering off;
  }
  location / {
    proxy_pass http://site:80;
    proxy_set_header Host $host;
  }
}
