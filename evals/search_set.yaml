# Search set for "Search what the bot knows": questions a visitor might type, in English, Portuguese and French,
# each with a piece of the passage it must find (case-insensitive, matched against the passages of
# knowledge/facts.md), or a list of pieces when several passages answer it. The search passes a question when one
# of those passages is in the top 3 shown on the site.
# Run with: cd api && uv run python -m golden.search_eval

