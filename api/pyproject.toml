[project]
name = "portfolio-api"
version = "0.1.0"
description = "Chat API for anthonymuniz.dev"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "redis>=8.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
