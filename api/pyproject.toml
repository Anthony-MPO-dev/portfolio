[project]
name = "portfolio-api"
version = "0.1.0"
description = "Chat API for anthonymuniz.dev"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.8",
    "pypdf>=7.0.0",
    "pyseccomp>=0.1.2 ; sys_platform == 'linux'",
    "pyyaml>=6.0.3",
    "redis>=8.1",
    "tokenizers>=0.23.3",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
